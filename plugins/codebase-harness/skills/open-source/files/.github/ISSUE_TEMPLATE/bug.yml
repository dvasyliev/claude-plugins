name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the bug.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Paste errors and logs as text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The project version (or commit), and your OS, runtime or browser where it matters.
    validations:
      required: true
