# Runs on GitHub what the local git hooks run: commitlint on the commit messages of a pull
# request, and `claude plugin validate` on the marketplace and the plugin. The smoke job installs
# the harness with every module into a new Next.js, React, Python, React + Python, Node and
# Python + Node project, then runs it again and expects no change, so a broken apply.mjs or module
# never reaches a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/codebase-harness

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test plugins/*/tests/*.test.mjs

  commitlint:
    # Dependabot's commit bodies hold release notes with long lines that commitlint rejects.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  smoke:
    name: smoke (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - framework: nextjs
            stacks: '"nextjs"'
            package: '{"name":"smoke","private":true,"scripts":{"dev":"next dev"},"dependencies":{"next":"16.0.0","react":"19.2.0","react-dom":"19.2.0"}}'
            modules: '"core","tsc","prettier","feature-workflow","eslint","knip","dupes","tailwind","vitest","playwright","commitlint","pre-commit","sync-deps","ci","dependency-updates","react-practices","context7","libraries","next-docs","page-speed"'
          - framework: react
            stacks: '"react"'
            package: '{"name":"smoke","private":true,"scripts":{"dev":"vite"},"dependencies":{"react":"19.2.0","react-dom":"19.2.0"},"devDependencies":{"vite":"7.0.0"}}'
            modules: '"core","tsc","prettier","feature-workflow","oxlint","knip","dupes","tailwind","vitest","playwright","commitlint","pre-commit","sync-deps","ci","dependency-updates","react-practices","context7","libraries","next-docs","page-speed"'
          - framework: python
            stacks: '"python"'
            srcDirs: '"python":["app"]'
            modules: '"core","basedpyright","feature-workflow","context-size","ruff","file-size","vulture","deptry","dupes","import-linter","pytest","commitlint","pre-commit","sync-deps","ci","dependency-updates","python-practices","context7","libraries"'
          - framework: node
            stacks: '"node"'
            package: '{"name":"smoke","private":true,"scripts":{"start":"node index.js"},"dependencies":{"express":"5.1.0"}}'
            modules: '"core","tsc","prettier","feature-workflow","context-size","oxlint","knip","dupes","vitest","commitlint","pre-commit","sync-deps","ci","dependency-updates","node-practices","context7","libraries"'
          - framework: python+node
            stacks: '"python","node"'
            srcDirs: '"python":["app"],"node":["scripts"]'
            modules: '"core","tsc","basedpyright","prettier","feature-workflow","context-size","oxlint","ruff","file-size","knip","vulture","deptry","dupes","import-linter","vitest","pytest","commitlint","pre-commit","sync-deps","ci","dependency-updates","node-practices","python-practices","context7","libraries"'
          - framework: react+python
            stacks: '"react","python"'
            package: '{"name":"smoke","private":true,"scripts":{"dev":"vite"},"dependencies":{"react":"19.2.0","react-dom":"19.2.0"},"devDependencies":{"vite":"7.0.0"}}'
            srcDirs: '"python":["app"]'
            modules: '"core","tsc","basedpyright","prettier","feature-workflow","context-size","oxlint","ruff","file-size","knip","vulture","deptry","dupes","import-linter","tailwind","vitest","pytest","playwright","commitlint","pre-commit","sync-deps","ci","dependency-updates","react-practices","python-practices","context7","libraries","page-speed"'
    env:
      HARNESS_NO_INSTALL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the harness with every module
        run: |
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          git init -q
          if [ -n '${{ matrix.package }}' ]; then echo '${{ matrix.package }}' > package.json; fi
          case '${{ matrix.stacks }}' in *python*) printf '[project]\nname = "smoke"\nversion = "0.1.0"\n' > pyproject.toml ;; esac
          node "$GITHUB_WORKSPACE/plugins/codebase-harness/tasks/apply.mjs" '{"stacks":[${{ matrix.stacks }}],"srcDirs":{${{ matrix.srcDirs }}},"modules":[${{ matrix.modules }}]}'
          case '${{ matrix.stacks }}' in *node*) test -f package.json || { echo "missing package.json"; exit 1; } ;; esac
          for f in CLAUDE.md .claude/harness.json .claude/settings.json .claude/hooks/check-all.sh .githooks/pre-commit; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Run it again and expect no change
        run: |
          cd "$RUNNER_TEMP/app"
          git add -A
          node "$GITHUB_WORKSPACE/plugins/codebase-harness/tasks/apply.mjs" '{}'
          git diff --exit-code
